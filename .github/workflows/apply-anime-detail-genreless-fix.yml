name: Apply anime genre-less detail fix

on:
  push:
    branches: [fix/anime-detail-genreless-20260905]
    paths: ['.github/workflows/apply-anime-detail-genreless-fix.yml']

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/anime-detail-genreless-20260905
      - name: Apply focused repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path('src/services/anime.service.ts')
          text = service.read_text()
          old = "this.source.getHtml(animeDetailUrl(malId), ['Score:', 'Genre'])"
          new = "this.source.getHtml(animeDetailUrl(malId), ['Score:', 'Type:', 'Status:'])"
          if text.count(old) != 2:
              raise SystemExit(f'expected exactly 2 anime detail marker callsites, found {text.count(old)}')
          service.write_text(text.replace(old, new))

          test = Path('tests/source/anime-detail-structural-validation.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';
          import { MalClient } from '../../src/source/mal-client';

          const config = {
            profileTtlSeconds: 1,
            listTtlSeconds: 1,
            animeTtlSeconds: 1,
            catalogTtlSeconds: 1,
            sourceTimeoutMs: 1000,
            maxUpstreamBytes: 10_000,
            malUserAgent: 'test',
          };

          describe('anime detail structural validation', () => {
            it('accepts a legitimate anime detail page without a Genre field', async () => {
              const genrelessAnime = `<html><body>${'anime detail '.repeat(60)} Score: N/A Type: Music Status: Finished Airing</body></html>`;
              const client = new MalClient(config, async () => new Response(genrelessAnime, {
                status: 200,
                headers: { 'content-type': 'text/html' },
              }));

              const result = await client.getHtml(
                'https://myanimelist.net/anime/58313',
                ['Score:', 'Type:', 'Status:'],
              );

              expect(result.kind).toBe('success');
            });

            it('still rejects a challenge page even when universal detail markers are present', async () => {
              const challenge = `<html><body>${'challenge '.repeat(60)} Just a moment Score: N/A Type: Music Status: Finished Airing</body></html>`;
              const client = new MalClient(config, async () => new Response(challenge, {
                status: 200,
                headers: { 'content-type': 'text/html' },
              }));

              const result = await client.getHtml(
                'https://myanimelist.net/anime/58313',
                ['Score:', 'Type:', 'Status:'],
              );

              expect(result).toMatchObject({ kind: 'suspicious', reason: 'challenge_or_login' });
            });
          });
          """)
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/anime.service.ts tests/source/anime-detail-structural-validation.test.ts
          git commit -m 'Accept valid genre-less anime detail pages'
          git push origin HEAD:fix/anime-detail-genreless-20260905
