name: Temporary Apply Genreless Manga Fix

on:
  push:
    branches:
      - fix/manga-detail-genreless-20260903

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manga-detail-genreless-20260903
          fetch-depth: 0
      - name: Apply narrow marker fix and regression coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          service = Path('src/services/manga.service.ts')
          text = service.read_text()
          old = "const source = await this.source.getHtml(mangaDetailUrl(malId), ['Score:', 'Genre']);"
          new = "const source = await this.source.getHtml(mangaDetailUrl(malId), ['Score:', 'Type:', 'Status:']);"
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one old marker contract, found {text.count(old)}')
          service.write_text(text.replace(old, new), newline='\n')

          test = Path('tests/source/manga-detail-structural-validation.test.ts')
          test.write_text("""import { describe, expect, it } from 'vitest';
          import { MalClient } from '../../src/source/mal-client';

          const config = {
            profileTtlSeconds: 1,
            listTtlSeconds: 1,
            animeTtlSeconds: 1,
            catalogTtlSeconds: 1,
            sourceTimeoutMs: 1000,
            maxUpstreamBytes: 10_000,
            malUserAgent: 'test',
          };

          describe('manga detail structural validation', () => {
            it('accepts a legitimate manga detail page without a Genre field', async () => {
              const genrelessManga = `<html><body>${'manga detail '.repeat(60)} Score: N/A Type: Manga Status: Finished Published: Jan 1, 2015</body></html>`;
              const client = new MalClient(config, async () => new Response(genrelessManga, {
                status: 200,
                headers: { 'content-type': 'text/html' },
              }));

              const result = await client.getHtml(
                'https://myanimelist.net/manga/82743',
                ['Score:', 'Type:', 'Status:'],
              );

              expect(result.kind).toBe('success');
            });

            it('still rejects a challenge page even when universal detail markers are present', async () => {
              const challenge = `<html><body>${'challenge '.repeat(60)} Just a moment Score: N/A Type: Manga Status: Finished</body></html>`;
              const client = new MalClient(config, async () => new Response(challenge, {
                status: 200,
                headers: { 'content-type': 'text/html' },
              }));

              const result = await client.getHtml(
                'https://myanimelist.net/manga/82743',
                ['Score:', 'Type:', 'Status:'],
              );

              expect(result).toMatchObject({ kind: 'suspicious', reason: 'challenge_or_login' });
            });
          });
          """, newline='\n')
          PY
          git diff --check
          git rm .github/workflows/temp-apply-genreless-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/services/manga.service.ts tests/source/manga-detail-structural-validation.test.ts
          git commit -m 'Fix genre-less manga detail validation'
          git push origin HEAD:fix/manga-detail-genreless-20260903
